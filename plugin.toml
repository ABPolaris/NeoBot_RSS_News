name = "NeoBot_RSS_News"
version = "0.3.0-a2"
description = "按聊天指令拉取 RSS 新闻并私聊发送"
author = "AkiPolaris"
license = "MIT"
tags = ["rss", "news", "feed", "command"]

python_dependencies = [
    "pydantic>=2,<3",
    "feedparser>=6.0,<7",
    "lxml>=5,<7",
    "httpx>=0.27,<0.29",
    "aiosqlite>=0.20,<0.23",
]

hot_reload = true
config_hot_reload = true

# 运行配置在 plugins_data/NeoBot_RSS_News/config.toml，本表只提供打包默认值。
[config]
# 是否在收到新闻指令后发送文章；关闭等于静音
send_enabled = true
# 仅标题 / 标题和链接 / 标题和开头 / 标题和正文 / 标题、链接和开头
content_format = "title_link_lead"
# 每条订阅每次请求发送的文章数
per_source_limit = 10
# 单次请求用户最多接收的文章总数
per_destination_limit = 50
# 两次拉取的最小间隔，范围 15-720 分钟
pull_interval_minutes = 120
# 文章缓存保留天数，范围 7-30 天
cache_days = 10
# 多条消息之间的间隔，范围 1-5 秒
message_interval_seconds = 2

[sdk]
version = 1
contract = "plugin.contract.json"
pages = ["web/index.html"]
