name = "NeoBot_RSS_News"
version = "0.1.0"
description = "定期从 RSS 源获取新闻文章并私聊发送给接收者"
author = "AkiPolaris"
license = "MIT"
tags = ["rss", "news", "feed", "scheduler"]

python_dependencies = [
    "pydantic>=2,<3",
    "feedparser>=6.0,<7",
    "lxml>=5,<7",
    "httpx>=0.27,<0.29",
    "aiosqlite>=0.20,<0.23",
    "tzdata>=2024.1",
]

hot_reload = true
config_hot_reload = true

# 运行配置在 plugins_data/NeoBot_RSS_News/config.toml，本表只提供打包默认值。
[config]
# 默认不发送；开启后才会按周期向接收者发送文章
send_enabled = false
# 每若干天发送一次，范围 1-7 天
send_every_days = 1
# 24 小时制 HH:MM，发送窗口为此刻起 5 分钟
send_time = "18:00"
# IANA 时区名
timezone = "Asia/Shanghai"
# 消息-尽可能合并 / 消息-分订阅发送 / 消息-分条发送
send_format = "per_source"
# 仅标题 / 标题和链接 / 标题和开头 / 标题和正文 / 标题、链接和开头
content_format = "title_link_lead"
# 每条订阅每轮发送的文章数
per_source_limit = 10
# 每个接收者每轮接收的文章总数
per_destination_limit = 50
# 拉取间隔，范围 15-720 分钟
pull_interval_minutes = 120
# 文章缓存保留天数，范围 7-30 天
cache_days = 10
# 连续发送多条消息时的间隔，范围 1-5 秒
message_interval_seconds = 2

[sdk]
version = 1
contract = "plugin.contract.json"
pages = ["web/index.html"]
